name: Next.js 16 dependency and build validation

on:
  push:
    branches: [security/nextjs-16-upgrade]
    paths:
      - "package.json"
      - "next.config.js"
      - "middleware.ts"
      - "proxy.ts"
      - "eslint.config.mjs"
      - ".github/workflows/next16-lock-refresh.yml"
      - "scripts/tests/procurement-workflow-hardening.test.cjs"
      - "scripts/tests/system-branding.test.cjs"

permissions:
  contents: write

jobs:
  update-lock-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out upgrade branch
        uses: actions/checkout@v5
        with:
          ref: security/nextjs-16-upgrade
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Regenerate Bun lockfile
        run: bun install --lockfile-only

      - name: Verify frozen lockfile and installed security versions
        run: |
          bun install --frozen-lockfile
          node <<'NODE'
          const fs = require("node:fs");
          const { createRequire } = require("node:module");
          const lockText = fs.readFileSync("bun.lock", "utf8");
          const allSharpResolutions = [...lockText.matchAll(/sharp@([^"\\s]+)/g)].map((match) => match[1]);
          if (!lockText.includes('"sharp@0.35.5"')) throw new Error("bun.lock is missing sharp@0.35.5");
          if (allSharpResolutions.some((version) => version !== "0.35.5")) {
            throw new Error("Unexpected sharp versions remain in bun.lock: " + allSharpResolutions.join(", "));
          }

          const readVersion = (name) => {
            const packageJson = require.resolve(name + "/package.json");
            return JSON.parse(fs.readFileSync(packageJson, "utf8")).version;
          };
          const rootSharp = require("sharp");
          const transformerRequire = createRequire(require.resolve("@xenova/transformers"));
          const transformerSharp = transformerRequire("sharp");
          const versions = {
            next: readVersion("next"),
            react: readVersion("react"),
            reactDom: readVersion("react-dom"),
            sharp: rootSharp.versions.sharp,
            transformerSharp: transformerSharp.versions.sharp,
          };

          if (versions.next !== "16.4.5") throw new Error("Installed Next.js version is not 16.4.5");
          if (versions.react !== "19.3.1" || versions.reactDom !== "19.3.1") throw new Error("Installed React versions do not match");
          if (versions.sharp !== "0.35.5" || versions.transformerSharp !== "0.35.5") {
            throw new Error("The runtime or @xenova/transformers resolves an unpatched Sharp version: " + JSON.stringify(versions));
          }
          console.log(versions);
          NODE

      - name: Run ESLint
        run: bun run lint

      - name: Run procurement regression tests
        run: bun run test:procurement

      - name: Build production application
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Commit generated Bun lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate Bun lockfile for Next.js 16"
            git push origin security/nextjs-16-upgrade
          else
            echo "bun.lock is already current"
          fi
