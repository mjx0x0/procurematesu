name: PRO Admin audit tests

on:
  push:
    branches: [master]
    paths:
      - "app/api/admin/complete-stage/route.ts"
      - "app/admin/purchase-requests/page.tsx"
      - "app/api/admin/pr-details/route.ts"
      - "app/dashboard/pr/[pr_no]/page.tsx"
      - "scripts/provision-pro-admins.mjs"
      - "scripts/tests/pro-admin-audit.test.cjs"
      - "supabase/migrations/*_add_procurement_stage_actor_audit.sql"
      - ".github/workflows/pro-admin-audit-tests.yml"
  pull_request:
    branches: [master]
    paths:
      - "app/api/admin/complete-stage/route.ts"
      - "app/admin/purchase-requests/page.tsx"
      - "app/api/admin/pr-details/route.ts"
      - "app/dashboard/pr/[pr_no]/page.tsx"
      - "scripts/provision-pro-admins.mjs"
      - "scripts/tests/pro-admin-audit.test.cjs"
      - "supabase/migrations/*_add_procurement_stage_actor_audit.sql"
      - ".github/workflows/pro-admin-audit-tests.yml"

jobs:
  pro-admin-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run PRO Admin audit regression tests
        run: node --test scripts/tests/pro-admin-audit.test.cjs
