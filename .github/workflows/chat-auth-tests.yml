name: Authenticated chatbot integration tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [fix/pr-draft-extract-all-details]

permissions:
  contents: read

jobs:
  authenticated-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --no-package-lock

      - name: Run authenticated chatbot integration tests
        run: node --test scripts/tests/chat-send-auth.integration.test.cjs
