name: Procurement answer guard tests

on:
  push:
    branches: [master]
    paths:
      - "lib/procurement-answer-guards.js"
      - "lib/document-retrieval.ts"
      - "lib/procurement-issuance-intents.js"
      - "scripts/tests/procurement-answer-guards.test.cjs"
      - "scripts/tests/procurement-issuance-intents.test.cjs"
      - "scripts/tests/procurement-accuracy-matrix.test.cjs"
      - "package.json"
      - ".github/workflows/procurement-guard-tests.yml"
  pull_request:
    branches: [master]
    paths:
      - "lib/procurement-answer-guards.js"
      - "lib/document-retrieval.ts"
      - "lib/procurement-issuance-intents.js"
      - "scripts/tests/procurement-answer-guards.test.cjs"
      - "scripts/tests/procurement-issuance-intents.test.cjs"
      - "package.json"
      - ".github/workflows/procurement-guard-tests.yml"

jobs:
  procurement-answer-guards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run procurement answer guard regression tests
        run: node --test scripts/tests/procurement-answer-guards.test.cjs scripts/tests/procurement-issuance-intents.test.cjs scripts/tests/procurement-accuracy-matrix.test.cjs
