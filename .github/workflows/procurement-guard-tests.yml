name: Procurement answer guard tests

on:
  push:
    branches: [master]
    paths:
      - "lib/procurement-answer-guards.js"
      - "lib/procurement-office-location.js"
      - "lib/procurement-answer-guards.d.ts"
      - "lib/procurement-scope-guard.js"
      - "lib/procurement-scope-guard.d.ts"
      - "app/api/chat/route.ts"
      - "app/api/chat/send/route.ts"
      - "app/api/slot-fill/route.ts"
      - "lib/document-retrieval.ts"
      - "lib/procurement-issuance-intents.js"
      - "scripts/tests/procurement-answer-guards.test.cjs"
      - "scripts/tests/procurement-issuance-intents.test.cjs"
      - "scripts/tests/procurement-accuracy-matrix.test.cjs"
      - "scripts/tests/procurement-office-location.test.cjs"
      - "scripts/tests/procurement-scope-guard.test.cjs"
      - "package.json"
      - ".github/workflows/procurement-guard-tests.yml"
      - "lib/chat-response-format.js"
      - "lib/chat-response-format.d.ts"
      - "components/chatbot/ChatMessageContent.tsx"
      - "components/chatbot/Chatbot.tsx"
      - "app/dashboard/chatbot/page.tsx"
      - "scripts/tests/chat-response-format.test.cjs"
      - "lib/procurement-departments.js"
      - "lib/procurement-departments.d.ts"
      - "lib/pr-draft-handoff.js"
      - "lib/pr-draft-handoff.d.ts"
      - "app/dashboard/new-pr/ProcurementRequestForm.tsx"
      - "scripts/tests/pr-draft-handoff.test.cjs"
      - "scripts/tests/chat-send-auth.integration.test.cjs"
      - "lib/system-branding.ts"
      - "components/LandingPage.tsx"
      - "components/SystemBranding.tsx"
      - "components/auth/LandingLoginCard.tsx"
      - "components/msu-logo.tsx"
      - "app/layout.tsx"
      - "metadata.json"
      - "app/auth/signup/page.tsx"
      - "app/dashboard/page.tsx"
      - "app/admin/page.tsx"
      - "app/dashboard/purchase-requests/page.tsx"
      - "app/loading.tsx"
      - "scripts/tests/system-branding.test.cjs"
  pull_request:
    branches: [master]
    paths:
      - "lib/procurement-answer-guards.js"
      - "lib/procurement-answer-guards.d.ts"
      - "lib/procurement-scope-guard.js"
      - "lib/procurement-scope-guard.d.ts"
      - "app/api/chat/route.ts"
      - "app/api/chat/send/route.ts"
      - "app/api/slot-fill/route.ts"
      - "lib/document-retrieval.ts"
      - "lib/procurement-issuance-intents.js"
      - "scripts/tests/procurement-answer-guards.test.cjs"
      - "scripts/tests/procurement-issuance-intents.test.cjs"
      - "scripts/tests/procurement-accuracy-matrix.test.cjs"
      - "scripts/tests/procurement-office-location.test.cjs"
      - "scripts/tests/procurement-scope-guard.test.cjs"
      - "package.json"
      - ".github/workflows/procurement-guard-tests.yml"

      - "lib/chat-response-format.js"
      - "lib/chat-response-format.d.ts"
      - "components/chatbot/ChatMessageContent.tsx"
      - "components/chatbot/Chatbot.tsx"
      - "app/dashboard/chatbot/page.tsx"
      - "scripts/tests/chat-response-format.test.cjs"
      - "lib/procurement-departments.js"
      - "lib/procurement-departments.d.ts"
      - "lib/pr-draft-handoff.js"
      - "lib/pr-draft-handoff.d.ts"
      - "app/dashboard/new-pr/ProcurementRequestForm.tsx"
      - "scripts/tests/pr-draft-handoff.test.cjs"
      - "scripts/tests/chat-send-auth.integration.test.cjs"
      - "lib/system-branding.ts"
      - "components/LandingPage.tsx"
      - "components/SystemBranding.tsx"
      - "components/auth/LandingLoginCard.tsx"
      - "components/msu-logo.tsx"
      - "app/layout.tsx"
      - "metadata.json"
      - "app/auth/signup/page.tsx"
      - "app/dashboard/page.tsx"
      - "app/admin/page.tsx"
      - "app/dashboard/purchase-requests/page.tsx"
      - "app/loading.tsx"
      - "scripts/tests/system-branding.test.cjs"
jobs:
  procurement-answer-guards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run procurement answer guard regression tests
        run: node --test scripts/tests/pr-draft-handoff.test.cjs scripts/tests/procurement-answer-guards.test.cjs scripts/tests/procurement-issuance-intents.test.cjs scripts/tests/procurement-accuracy-matrix.test.cjs scripts/tests/procurement-office-location.test.cjs scripts/tests/procurement-scope-guard.test.cjs scripts/tests/chat-response-format.test.cjs scripts/tests/system-branding.test.cjs
